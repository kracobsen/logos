<!doctype html>
<!--
  PROTOTYPE, throwaway. Never merged.
  Question (wayfinder ticket #49, map #46): how should the Speaking λ map to grayscale in the Mono annotation,
  which iOS turns into the Clear (light, dark) and Tinted (light, dark) appearances?
  Geometry fixed: proportions variant 3 (λ 82, two waves 36). The four appearances are rough CSS approximations
  of what iOS does with a Mono annotation, not the real renderer. Judge the grey mapping, not the glass.
  Open in a browser. Switch with the bottom bar, ← → keys, or the grid; T cycles the tint colour. ?variant=1..4
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Logos icon mono</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px -apple-system, system-ui, sans-serif; background: #F2F2F7; color: #111; padding: 32px 32px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: #666; }
  .stage { display: flex; gap: 22px; justify-content: center; margin: 28px 0 12px; flex-wrap: wrap; }
  .wall { width: 300px; padding: 26px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; gap: 16px;
          background:
            radial-gradient(circle at 20% 25%, #FF6B6B 0 60px, transparent 61px),
            radial-gradient(circle at 80% 70%, #4D96FF 0 80px, transparent 81px),
            radial-gradient(circle at 70% 20%, #FFD93D 0 40px, transparent 41px),
            linear-gradient(160deg, #A7C4F2, #F3C6D9); }
  .wall.dark { background:
            radial-gradient(circle at 20% 25%, #7A2E3A 0 60px, transparent 61px),
            radial-gradient(circle at 80% 70%, #1F3F7A 0 80px, transparent 81px),
            radial-gradient(circle at 70% 20%, #6B5A1A 0 40px, transparent 41px),
            linear-gradient(160deg, #1B2440, #3A1E33); }
  .wall .title { font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #0008; }
  .ic { border-radius: 22.5%; overflow: hidden; position: relative; }
  .ic svg { display: block; width: 100%; height: 100%; }
  .ic.big { width: 200px; height: 200px; }
  .ic.small { width: 60px; height: 60px; }
  .clear-light { background: rgba(255,255,255,.28); backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
  .clear-dark  { background: rgba(0,0,0,.42); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .state { text-align: center; font: 12px ui-monospace, monospace; margin-bottom: 24px; }
  .grid { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .grid button { all: unset; cursor: pointer; text-align: center; font-size: 12px; width: 190px; padding: 8px; border-radius: 16px; border: 3px solid transparent; }
  .grid button[aria-current="true"] { border-color: #0A84FF; }
  .grid .ic { width: 80px; height: 80px; margin: 0 auto 6px; background: #111; }
  .bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px;
         padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px #0005; z-index: 9; }
  .bar button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 999px; background: #333; }
  .bar .label { min-width: 260px; text-align: center; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
</style>
</head>
<body>
<h1>PROTOTYPE · Logos icon Mono annotation (Clear and Tinted)</h1>
<div class="muted">Four ways to map the λ and the waves to grey. Each mapping shown as rough Clear light, Clear dark, Tinted light and Tinted dark.</div>

<div class="stage" id="stage"></div>
<div class="state" id="state"></div>
<h3 style="text-align:center">The four Mono annotations as drawn (white on black)</h3>
<div class="grid" id="grid"></div>

<div class="bar">
  <button id="prev" title="Previous (←)">←</button>
  <span class="label" id="label"></span>
  <button id="next" title="Next (→)">→</button>
  <button id="tintBtn" title="Cycle tint (T)"></button>
</div>

<script>
// grey level 0..1 for [λ, inner wave, outer wave]
const variants = [
  { name: "λ white, waves light grey", note: "λ is the hero; waves sit just below it (70%). Apple's default advice.", g: [1, .7, .7] },
  { name: "All white", note: "One tone: maximum legibility, no hierarchy between letter and sound.", g: [1, 1, 1] },
  { name: "Waves white, λ grey", note: "Sound as the hero: waves white, λ at 62%.", g: [.62, 1, 1] },
  { name: "λ white, waves fading", note: "λ white, inner wave 70%, outer wave 42%: sound dying away, widest range.", g: [1, .7, .42] },
];
const tints = [["Orange", "#FF9F0A"], ["Blue", "#0A84FF"], ["Green", "#30D158"], ["Pink", "#FF375F"]];

const PATHS = {
  lambda: ["M240 250 Q340 240 390 360 L580 800", "M460 520 L270 800"],
  inner: "M650 330 Q730 420 650 510",
  outer: "M740 250 Q860 420 740 590",
};
// colours: [λ, inner, outer] as CSS colours; bg: CSS fill or "none"
function mark(cols, bg) {
  const S = (d, c, w) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 1024 1024">${bg ? `<rect width="1024" height="1024" fill="${bg}"/>` : ""}
    <g transform="translate(-28 -13)">${PATHS.lambda.map(d => S(d, cols[0], 82)).join("")}${S(PATHS.inner, cols[1], 36)}${S(PATHS.outer, cols[2], 36)}</g></svg>`;
}
const hexToRgb = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
const mix = (a, b, t) => a.map((x, k) => Math.round(x + (b[k] - x) * t));
const rgb = c => `rgb(${c.join(",")})`;

// rough stand-ins for how iOS derives each appearance from the grey levels
const appearances = {
  "Clear light": (g) => ({ cls: "clear-light", svg: mark(g.map(v => `rgba(255,255,255,${.35 + .65 * v})`)) }),
  "Clear dark":  (g) => ({ cls: "clear-dark",  svg: mark(g.map(v => `rgba(255,255,255,${.3 + .7 * v})`)) }),
  "Tinted light": (g, t) => ({ cls: "", svg: mark(g.map(v => `rgba(255,255,255,${.3 + .7 * v})`), rgb(mix(t, [255,255,255], .05))) }),
  "Tinted dark":  (g, t) => ({ cls: "", svg: mark(g.map(v => rgb(mix([20,20,22], t, .25 + .75 * v))), "#141416") }),
};

let i = Math.min(Math.max((parseInt(new URLSearchParams(location.search).get("variant")) || 1) - 1, 0), variants.length - 1);
let ti = 0;
function render() {
  const v = variants[i], t = hexToRgb(tints[ti][1]);
  stage.innerHTML = Object.entries(appearances).map(([name, f]) => {
    const a = f(v.g, t), dark = name.endsWith("dark");
    return `<div class="wall ${dark ? "dark" : ""}"><div class="title">${name}</div>
      <div class="ic big ${a.cls}">${a.svg}</div><div class="ic small ${a.cls}">${a.svg}</div></div>`;
  }).join("");
  grid.innerHTML = variants.map((x, k) =>
    `<button data-k="${k}" aria-current="${k === i}"><div class="ic">${mark(x.g.map(g => rgb([255*g,255*g,255*g].map(Math.round))))}</div>${k + 1}. ${x.name}</button>`).join("");
  label.textContent = `${i + 1} / ${variants.length} · ${v.name}`;
  tintBtn.innerHTML = `<span class="swatch" style="background:${tints[ti][1]}"></span>Tint: ${tints[ti][0]}`;
  state.textContent = `variant=${i + 1}  grey λ=${v.g[0]} inner=${v.g[1]} outer=${v.g[2]}  ·  ${v.note}`;
  history.replaceState(null, "", "?variant=" + (i + 1));
}
const go = d => { i = (i + d + variants.length) % variants.length; render(); };
prev.onclick = () => go(-1); next.onclick = () => go(1);
tintBtn.onclick = () => { ti = (ti + 1) % tints.length; render(); };
grid.onclick = e => { const b = e.target.closest("button"); if (b) { i = +b.dataset.k; render(); } };
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (e.key.toLowerCase() === "t") tintBtn.onclick();
});
render();
</script>
</body>
</html>
