<!doctype html>
<!--
  PROTOTYPE, throwaway. Never merged.
  Question (wayfinder ticket #49, map #46): what stroke weight and proportions should the Speaking λ icon have?
  Palette fixed to 6, Forest & lime (chosen in app-icon-colours.prototype.html). Only geometry changes.
  Each variant is shown in Default and Dark, large, at 60 pt and at 40 pt (Settings, Spotlight).
  Open in a browser. Switch with the bottom bar, the ← → keys, or by clicking the grid. ?variant=1..8
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Logos icon proportions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px -apple-system, system-ui, sans-serif; background: #F2F2F7; color: #111; padding: 32px 32px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: #666; }
  .stage { display: flex; gap: 32px; align-items: end; justify-content: center; margin: 28px 0 12px; flex-wrap: wrap; }
  .cap { text-align: center; font-size: 12px; color: #666; margin-top: 8px; }
  .big svg { width: 280px; height: 280px; display: block; }
  .sizes { display: grid; grid-template-columns: 60px 40px; gap: 18px 22px; align-items: end; padding: 22px; border-radius: 28px; }
  .sizes.light { background: linear-gradient(160deg, #A7C4F2, #F3C6D9); }
  .sizes.dark { background: linear-gradient(160deg, #1B2440, #3A1E33); }
  .s60 svg { width: 60px; height: 60px; display: block; }
  .s40 svg { width: 40px; height: 40px; display: block; }
  .state { text-align: center; font: 12px ui-monospace, monospace; margin-bottom: 24px; }
  .grid { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .grid button { all: unset; cursor: pointer; text-align: center; font-size: 12px; width: 150px; padding: 8px; border-radius: 16px; border: 3px solid transparent; }
  .grid button[aria-current="true"] { border-color: #0A84FF; }
  .pair { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  .pair svg { width: 64px; height: 64px; display: block; }
  .bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px;
         padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px #0005; z-index: 9; }
  .bar button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 999px; background: #333; }
  .bar .label { min-width: 240px; text-align: center; }
</style>
</head>
<body>
<h1>PROTOTYPE · Logos icon proportions (Speaking λ, Forest & lime)</h1>
<div class="muted">Same palette, eight geometries: stroke weight, mark size, number of waves and the shape of the λ.</div>

<div class="stage">
  <div><div class="big" id="bigL"></div><div class="cap">Default</div></div>
  <div><div class="big" id="bigD"></div><div class="cap">Dark</div></div>
  <div><div class="sizes light" id="sizesL"></div><div class="cap">60 pt and 40 pt, light</div></div>
  <div><div class="sizes dark" id="sizesD"></div><div class="cap">60 pt and 40 pt, dark</div></div>
</div>
<div class="state" id="state"></div>
<div class="grid" id="grid"></div>

<div class="bar">
  <button id="prev" title="Previous (←)">←</button>
  <span class="label" id="label"></span>
  <button id="next" title="Next (→)">→</button>
</div>

<script>
const LIGHT = ["#23845F","#0F4D3A","#FFFBEF","#EDE6CF","#D6F77F","#A6DB3A"];
const DARK  = ["#131A17","#050807","#9FE0C0","#5EB892","#D2F57A","#9CCB33"];

// λ shapes: curved hook (as chosen) or a straight, more geometric one
const LAMBDA = {
  curved:   ["M240 250 Q340 240 390 360 L580 800", "M460 520 L270 800"],
  straight: ["M250 250 L320 250 L580 800", "M455 535 L270 800"],
};
// sound waves, each [path, relative weight]; centred on the right of the λ
const WAVES = {
  one:   ["M680 300 Q790 420 680 540"],
  two:   ["M650 330 Q730 420 650 510", "M740 250 Q860 420 740 590"],
  three: ["M640 360 Q690 420 640 480", "M710 300 Q800 420 710 540", "M780 240 Q910 420 780 600"],
};

const variants = [
  { name: "As chosen", note: "The concept as picked: λ 110, two waves at 50.", lw: 110, ww: 50, scale: 1, lambda: "curved", waves: "two" },
  { name: "Bolder", note: "Heavier λ (140) and waves (66). Most robust at 40 pt.", lw: 140, ww: 66, scale: 1, lambda: "curved", waves: "two" },
  { name: "Lighter", note: "Thinner λ (82) and waves (36). Elegant large, risky small.", lw: 82, ww: 36, scale: 1, lambda: "curved", waves: "two" },
  { name: "Bigger mark", note: "As chosen, scaled up 12% so the mark fills more of the icon.", lw: 110, ww: 50, scale: 1.12, lambda: "curved", waves: "two" },
  { name: "Smaller mark", note: "As chosen, scaled down 12%: more background, quieter.", lw: 110, ww: 50, scale: 0.88, lambda: "curved", waves: "two" },
  { name: "One wave", note: "A single, bolder wave (64). Simplest silhouette.", lw: 120, ww: 64, scale: 1, lambda: "curved", waves: "one" },
  { name: "Three waves", note: "Three finer waves (40). Reads more as 'sound'.", lw: 110, ww: 40, scale: 1, lambda: "curved", waves: "three" },
  { name: "Straight λ", note: "A geometric λ without the curved hook, same weights as chosen.", lw: 110, ww: 50, scale: 1, lambda: "straight", waves: "two" },
];

let uid = 0;
function icon(c, v) {
  const id = "i" + (uid++);
  const grad = (n, a, b, y1, y2) => `<linearGradient id="${id}${n}" x1="0" y1="${y1}" x2="0" y2="${y2}" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const S = (d, n, w) => `<path d="${d}" fill="none" stroke="url(#${id}${n})" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  // centre the mark's bounding box on the canvas, then scale about the centre
  const cx = 512, cy = 512, t = `translate(${cx} ${cy}) scale(${v.scale}) translate(${-540} ${-525})`;
  return `<svg viewBox="0 0 1024 1024"><defs>
    ${grad("bg", c[0], c[1], 0, 1024)}${grad("fg", c[2], c[3], 200, 830)}${grad("ac", c[4], c[5], 200, 830)}
    <clipPath id="${id}clip"><rect width="1024" height="1024" rx="230"/></clipPath>
    <filter id="${id}glass" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="0.8" specularExponent="22" lighting-color="#fff" result="spec">
        <feDistantLight azimuth="270" elevation="50"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="sh"/><feOffset in="sh" dy="18" result="sho"/>
      <feFlood flood-color="#000" flood-opacity="0.28"/><feComposite in2="sho" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="specIn"/></feMerge>
    </filter></defs>
    <g clip-path="url(#${id}clip)"><rect width="1024" height="1024" fill="url(#${id}bg)"/>
    <g filter="url(#${id}glass)"><g transform="${t}">
      ${LAMBDA[v.lambda].map(d => S(d, "fg", v.lw)).join("")}
      ${WAVES[v.waves].map(d => S(d, "ac", v.ww)).join("")}
    </g></g></g></svg>`;
}

const sizes = (c, v) => `<div class="s60">${icon(c, v)}</div><div class="s40">${icon(c, v)}</div>`;

let i = Math.min(Math.max((parseInt(new URLSearchParams(location.search).get("variant")) || 1) - 1, 0), variants.length - 1);
function render() {
  const v = variants[i];
  bigL.innerHTML = icon(LIGHT, v); bigD.innerHTML = icon(DARK, v);
  sizesL.innerHTML = sizes(LIGHT, v); sizesD.innerHTML = sizes(DARK, v);
  grid.innerHTML = variants.map((x, k) =>
    `<button data-k="${k}" aria-current="${k === i}"><div class="pair">${icon(LIGHT, x)}${icon(DARK, x)}</div>${k + 1}. ${x.name}</button>`).join("");
  label.textContent = `${i + 1} / ${variants.length} · ${v.name}`;
  state.textContent = `variant=${i + 1}  λ=${v.lambda} ${v.lw}  waves=${v.waves} ${v.ww}  scale=${v.scale}  ·  ${v.note}`;
  history.replaceState(null, "", "?variant=" + (i + 1));
}
const go = d => { i = (i + d + variants.length) % variants.length; render(); };
prev.onclick = () => go(-1); next.onclick = () => go(1);
grid.onclick = e => { const b = e.target.closest("button"); if (b) { i = +b.dataset.k; render(); } };
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
});
render();
</script>
</body>
</html>
